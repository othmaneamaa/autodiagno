version: '3.8'

services:
  # 1. Base de données vectorielle Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: autoclaim_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 2. Tracking des expériences MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: autoclaim_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts --host 0.0.0.0
    volumes:
      - mlflow_data:/artifacts
    restart: unless-stopped

  # 3. Backend FastAPI & Agent LangGraph
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclaim_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - qdrant
      - mlflow
    volumes:
      - .:/app
    restart: unless-stopped

  # 4. Frontend Streamlit
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoclaim_ui
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  qdrant_storage:
  mlflow_data:
